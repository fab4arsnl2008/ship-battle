<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Starship.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Battle</title>
    <meta name="description" content="Command the U.S.S. Enterprise in a space battle against the Borg invasion." />
    <meta property="og:title" content="Ship Battle" />
    <meta property="og:description" content="Command the U.S.S. Enterprise in a space battle against the Borg invasion." />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;background:#000;color:#00d2ff;font-family:sans-serif;">
        <h1 style="color:#00d2ff;letter-spacing:2px;margin-bottom:1rem;">STAR TREK: SHIP BATTLE</h1>
        <p style="color:#ffffff;max-width:500px;line-height:1.6;margin-bottom:1.5rem;">
          To play the game, please either:
        </p>
        <div style="background:rgba(0,30,60,0.8);border:1px solid #00d2ff;border-radius:8px;padding:1.5rem;max-width:480px;text-align:left;color:#e0e0e0;">
          <p style="margin:0 0 0.8rem 0;"><strong>Option 1 (Standalone):</strong> Open <a href="./dist/index.html" style="color:#00d2ff;text-decoration:underline;">dist/index.html</a> directly in your browser.</p>
          <p style="margin:0;"><strong>Option 2 (Dev Server):</strong> Run <code style="background:#111;color:#00d2ff;padding:2px 6px;border-radius:4px;">npm run dev</code> in terminal and visit <a href="http://localhost:3000" style="color:#00d2ff;">http://localhost:3000</a>.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatically redirect to dist/index.html if opened directly via file://
      if (window.location.protocol === 'file:' && !window.location.href.includes('/dist/')) {
        window.location.replace('./dist/index.html');
      }
    </script>
  </body>
</html>
