<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Automatically redirect to dist/index.html on static hosts (e.g. GitHub Pages)
      if (
        window.location.hostname !== 'localhost' &&
        window.location.hostname !== '127.0.0.1' &&
        !window.location.pathname.includes('/dist/')
      ) {
        window.location.replace('./dist/index.html' + window.location.search + window.location.hash);
      }
    </script>
    <link rel="icon" type="image/png" href="./Starship.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Battle</title>
    <meta name="description" content="Command the U.S.S. Enterprise in a space battle against the Borg invasion." />
    <meta property="og:title" content="Ship Battle" />
    <meta property="og:description" content="Command the U.S.S. Enterprise in a space battle against the Borg invasion." />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
